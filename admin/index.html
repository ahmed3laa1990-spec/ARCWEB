<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم ARC</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A47;--gold:#F4B400;--gold-d:#c98f00;--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;
--text:#0E2A47;--muted:#6b7a8d;--danger:#c53030;--ok:#2f855a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none !important}
.num-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
a{color:var(--gold-d)}

.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{height:34px;background:#fff;border-radius:8px;padding:4px 7px}
.top h1{font-size:16px;font-weight:800}
.top .spacer{flex:1}
.top .who{font-size:13px;opacity:.75}
.tabs{background:#0b2239;padding:0 20px;display:flex;gap:4px;position:sticky;top:57px;z-index:19}
.tab{background:none;border:none;color:rgba(255,255,255,.62);padding:13px 18px;cursor:pointer;font-weight:700;font-size:14px;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:none;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;min-height:44px}
.btn-p{background:var(--gold);color:var(--navy)}
.btn-p:hover:not(:disabled){background:var(--gold-d)}
.btn-o{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-o:hover:not(:disabled){border-color:var(--gold)}
.btn-d{background:#fff;color:var(--danger);border:1.5px solid #f3c4c4}
.btn-s{padding:7px 12px;min-height:36px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.login{max-width:470px;margin:9vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:38px}
.login h2{font-size:24px;font-weight:800;margin-bottom:8px}
.login p{color:var(--muted);font-size:14px;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13.5px;font-weight:700}
.field input,.field select,.field textarea{padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);width:100%;min-height:46px;color:var(--text)}
.field textarea{min-height:110px;resize:vertical;line-height:1.8}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(244,180,0,.16)}
.field .hint{font-size:12px;color:var(--muted)}
.field input[dir=ltr],.field textarea[dir=ltr]{direction:ltr;text-align:left}
.pw-wrap{position:relative}
.pw-wrap input{padding-inline-end:48px}
#pwEye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;width:38px;height:38px;border-radius:9px}
#pwEye:hover{background:var(--bg)}

.notice{padding:13px 16px;border-radius:12px;font-size:14px;font-weight:500;margin-bottom:18px}
.notice.err{background:#fff5f5;border:1px solid #fed7d7;color:var(--danger)}
.notice.ok{background:#f0fff4;border:1px solid #c6f6d5;color:var(--ok)}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.dirty{font-size:13px;color:var(--gold-d);font-weight:700}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:30px;padding:8px 16px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted);min-height:40px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.list{display:flex;flex-direction:column;gap:11px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.lead-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.lead-head b{font-size:16.5px;font-weight:800}
.badge{font-size:11.5px;font-weight:800;padding:3px 11px;border-radius:20px}
.st-new{background:rgba(244,180,0,.2);color:var(--gold-d)}
.st-con{background:#e6f0fb;color:#2b6cb0}
.st-quo{background:#efe6fb;color:#6b46c1}
.st-won{background:#e6f7ec;color:var(--ok)}
.st-lost{background:#f2f4f7;color:var(--muted)}
.ago{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.facts{display:flex;gap:9px 22px;flex-wrap:wrap;font-size:13.5px;margin-bottom:10px}
.facts .k{color:var(--muted);margin-inline-end:6px}
.details{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.75;margin-bottom:11px;white-space:pre-wrap}
.notes{background:#fffbeb;border:1px solid #fde9b0;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:11px}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.status-sel{padding:7px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;min-height:36px;font-size:13px;font-weight:700}

.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:13px;align-items:center}
.row.off{opacity:.55}
.row img{width:74px;height:52px;object-fit:cover;border-radius:9px;background:var(--bg);flex-shrink:0}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{font-size:12.5px;color:var(--muted)}
.row .acts{flex-shrink:0}

.editor{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:20px}
.editor h3{font-size:19px;font-weight:800;margin-bottom:4px}
.editor .sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.sec{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
.sec h4{font-size:14px;font-weight:800;margin-bottom:14px}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgbox{position:relative;width:118px}
.imgbox img{width:118px;height:82px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);display:block}
.imgbox .tools{display:flex;gap:4px;margin-top:5px;justify-content:center}
.imgbox .tools button{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px}
.imgbox .tools button:hover:not(:disabled){border-color:var(--gold)}
.imgbox .first{position:absolute;top:5px;inset-inline-start:5px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
</style>
</head>
<body>

<div class="top">
  <img src="../assets/logo.png" alt="ARC">
  <h1>لوحة تحكم الموقع</h1>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="btn btn-o btn-s hidden" id="logout" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">خروج</button>
</div>

<div class="tabs hidden" id="tabs">
  <button class="tab on" data-tab="leads">طلبات العملاء</button>
  <button class="tab" data-tab="projects">المشاريع</button>
</div>

<div class="wrap" id="loginView">
  <div class="login">
    <h2>تسجيل الدخول</h2>
    <p>ادخل ببريدك وكلمة المرور المسجّلة في Supabase.</p>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" dir="ltr" autocomplete="username">
    </div>
    <div class="field">
      <label for="pw">كلمة المرور</label>
      <div class="pw-wrap">
        <input type="password" id="pw" dir="ltr" autocomplete="current-password">
        <button type="button" id="pwEye" aria-label="إظهار كلمة المرور">👁</button>
      </div>
    </div>
    <div id="loginMsg"></div>
    <button class="btn btn-p" id="loginBtn" style="width:100%">دخول</button>
  </div>
</div>

<div class="wrap hidden" id="appView">
  <div id="msg"></div>
  <div class="bar">
    <button class="btn btn-o" id="refresh">تحديث</button>
    <span style="flex:1"></span>
    <span class="dirty hidden" id="dirty">تغييرات غير محفوظة</span>
  </div>
  <div id="body"></div>
</div>

<script src="../tools/render.js"></script>
<script src="app.js"></script>
<script>
  // reveal the tab strip once a session exists
  new MutationObserver(function () {
    document.getElementById('tabs').classList.toggle('hidden',
      document.getElementById('appView').classList.contains('hidden'));
  }).observe(document.getElementById('appView'), { attributes: true, attributeFilter: ['class'] });
</script>
</body>
</html>
